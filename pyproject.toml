[project]
name = "pytune_auth_common"
version = "1.3.3"
description = "Module commun pour la gestion d'authentification et de ratelimit dans PyTune"
requires-python = ">=3.12,<3.13"

dependencies = [
    "fastapi",
    "python-jose",
    "redis",
    "pydantic",
    "cryptography",
    "python-dotenv",
    "starlette",
    "tortoise-orm",
    "requests",
    "typing-extensions",
    "aiohttp",
    "colorama",
    "passlib>=1.7.4",
    "argon2-cffi>=23.1.0",
    "google-auth>=2.34.0",
    "google-auth-oauthlib>=1.2.0",

    # dépendances internes
    "pytune_configuration",
    "simple_logger",
    "pytune_data",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pytune_auth_common"]